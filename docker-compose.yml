version: '3.8'

services:
  # ---------------------------------
  # 1. OUR PYTHON APPLICATION
  # ---------------------------------
  app:
    build: .                  
    container_name: devops-app
    ports:
      - "8000:8000"           
    env_file:
      - .env                  
    depends_on:
      - db                    

  # ---------------------------------
  # 2. THE POSTGRESQL DATABASE
  # ---------------------------------
  db:
    image: postgres:15-alpine # The official lightweight Postgres image
    container_name: devops-db
    ports:
      - "5432:5432"           
    env_file:
      - .env                  
    environment:
      
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data  
volumes:
  pgdata:
